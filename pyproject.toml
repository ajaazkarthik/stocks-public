# pyproject.toml — stocks trading system
# Generated: 2026-04-22
#
# Before (T1.2 benchmark):
#   pip install <package>   → unversioned, breaks on any PyPI update
#   New machine setup       → IMPOSSIBLE — no manifest existed
#
# After:
#   uv sync                 → exact reproducible environment, <60 s
#   uv add <pkg>            → updates lockfile atomically
#
# Install uv (once):
#   powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
# Reproduce environment:
#   uv sync
# Add a new package:
#   uv add <package>

[project]
name            = "stocks-trading"
version         = "0.1.0"
description     = "Personal multi-broker portfolio + trading-signal cockpit (AU/SG/US/HK/IN)"
requires-python = ">=3.12"

dependencies = [
    # ── Broker APIs ────────────────────────────────────────────────────────
    "moomoo_api>=10.2.6218",       # Moomoo/FUTU OpenD (AU port 11111, SG port 11112)
    "futu_api>=10.2.6218",         # FUTU underlying SDK (bundled with moomoo_api)
    "kiteconnect>=5.1.0",          # Zerodha KiteConnect API
    "smartapi-python>=1.5.5",      # Angel One SmartAPI + TOTP
    "ibapi>=10.37.2",              # Interactive Brokers TWS API
    "pyotp>=2.9.0",                # TOTP code generation for Angel One auth

    # ── Core data / market data ─────────────────────────────────────────────
    "requests>=2.33.1",
    "pandas>=2.3.3",
    "numpy>=2.4.4",
    "yfinance>=1.3.0",             # Yahoo Finance: prices, dividends, fundamentals + ValuationsMeasures + ETFQuery

    # ── PDF / file parsing ──────────────────────────────────────────────────
    "pdfplumber>=0.11.9",          # Webull AU PDF statement parser
    "openpyxl>=3.1.5",             # Excel file read/write

    # ── Signal / analysis ──────────────────────────────────────────────────
    "vaderSentiment>=3.3.2",       # News sentiment scoring (L3 enricher)
    "scipy>=1.17.1",               # Statistical helpers in signal scoring
    "plotly>=6.6.0",               # Interactive charts in HTML reports
    "beautifulsoup4>=4.12.0",      # HTML scraping (TV news, Smallcase)

    # ── AI / LLM ───────────────────────────────────────────────────────────
    "openai>=2.31.0",              # GPT-4o-mini commentary + NL query

    # ── Caching ────────────────────────────────────────────────────────────
    "diskcache>=5.6.3",            # Disk-based LRU cache for yfinance/TV calls

    # ── Web automation / scraping ───────────────────────────────────────────
    "twscrape>=0.17.0",            # Twitter/X enricher (auth brittle — may break)
    "playwright>=1.58.0",          # Browser automation (TV screener fetch)

    # ── Reporting ──────────────────────────────────────────────────────────
    "reportlab>=4.4.10",           # PDF report generation

    # ── Backtesting / analytics ─────────────────────────────────────────────
    "vectorbt>=1.0.0",             # Backtesting engine (Apache 2.0 + Commons Clause) — v1.0.0 Rust engine available via vectorbt[rust]
    "quantstats>=0.0.81",          # Portfolio return analytics (period-based)

    # ── Web API (FastAPI stack, pre-installed, ready for T2.3) ─────────────
    "fastapi>=0.135.3",            # REST API framework (Jinja2 bundled via Starlette)
    "uvicorn>=0.42.0",             # ASGI server
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",   # Settings management from env vars

    # ── Data validation ─────────────────────────────────────────────────────
    "pandera>=0.31.1",             # DataFrame schema validation

    # ── Structured logging ─────────────────────────────────────────────────
    "structlog>=25.5.0",           # Structured key-value logging with run_id correlation

    # ── Secret management (ready for T1.7 migration) ───────────────────────
    # "keyring>=25.7.0",           # Uncomment when secrets moved to Windows Credential Locker
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "hypothesis>=6.152.1",
    "ruff>=0.11.0",
]

# ── pytest configuration ─────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths        = ["."]
python_files     = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts          = "-v --tb=short"
asyncio_mode     = "strict"
markers          = [
    "tier1:   safe read-only tests, no broker required",
    "tier3:   import/syntax checks only",
    "broker:  requires live broker connection (offline graceful-fail tested)",
    "report:  validates existing HTML reports (skip if not yet generated)",
    "timeout: per-test timeout in seconds (requires pytest-timeout plugin)",
]

# ── ruff linting (consolidated from ruff.toml) ───────────────────────────────
[tool.ruff]
exclude = [
    ".git", "__pycache__", ".venv", "venv", "*.egg-info",
    "temp/", "logs/", ".cache/", "benchmarks/patches/",
]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "C4", "PIE", "T20", "UP", "PD", "RUF", "SIM", "ERA"]
ignore = [
    "E501",    # line too long
    "T201",    # print() — intentional in CLI scripts
    "ERA001",  # commented-out code — intentional
    "SIM108",  # ternary — sometimes explicit if/else is clearer
    "B008",    # function call in default arg — used in argparse
    "UP007",   # X | Y union — keep Union[] for 3.9 compat
]

[tool.ruff.lint.per-file-ignores]
"test_*.py"  = ["B", "E711", "E712"]
"*_test.py"  = ["B", "E711", "E712"]
"conftest.py" = ["F401"]

# ── uv settings ──────────────────────────────────────────────────────────────
[tool.uv]
dev-dependencies = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "hypothesis>=6.152.1",
    "ruff>=0.11.0",
]
